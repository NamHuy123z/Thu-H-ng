<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gửi Thu Hương 💫</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Dancing+Script:wght@700&display=swap">
<style>
:root{--ink:#fff4fa;--lilac:#c9b6ff;--script:"Dancing Script","Segoe Script",cursive;--sans:"Be Vietnam Pro",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;color:var(--ink);font-family:var(--sans);touch-action:none;
background:radial-gradient(60% 50% at 25% 35%,#3a1466bb,transparent 70%),radial-gradient(55% 45% at 78% 68%,#0f3a7a99,transparent 70%),radial-gradient(40% 35% at 58% 18%,#7a1f5c77,transparent 70%),#07041a}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 20px);text-align:center;padding:0 18px;pointer-events:none;z-index:2}
h1{font-family:var(--script);font-size:clamp(34px,8.5vw,68px);margin:0;line-height:1.1;text-shadow:0 0 26px #ff7aa8bb,0 0 4px #0009}
.top p{margin:8px auto 0;max-width:34ch;font-size:15px;line-height:1.5;color:var(--lilac)}
#boom{position:fixed;left:50%;top:56%;transform:translate(-50%,-50%);z-index:3;border:0;background:none;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font:inherit}
#boom span{font-size:92px;line-height:1;filter:drop-shadow(0 0 24px #ff4f8b);animation:beat 1.1s ease-in-out infinite}
#boom small{font-size:15px;color:var(--ink)}
@keyframes beat{50%{transform:scale(1.18)}}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center;font-size:13px;color:var(--lilac);opacity:0;transition:opacity 1s;pointer-events:none;z-index:2}
#mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;z-index:6;width:42px;height:42px;border-radius:50%;border:1px solid #ffffff44;background:#ffffff14;color:var(--ink);font-size:17px;cursor:pointer}
#intro{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px;text-align:center;background:radial-gradient(80% 60% at 50% 40%,#2a1052,#07041a);transition:opacity 1.2s}
#intro.gone{opacity:0;pointer-events:none}
#go{border:0;border-radius:999px;padding:15px 34px;font:600 17px var(--sans);color:#2a0d3e;background:linear-gradient(135deg,#ffd27a,#ff8fb3);cursor:pointer;box-shadow:0 0 30px #ff7aa877}
#go:focus-visible,#boom:focus-visible,#mute:focus-visible{outline:3px solid #ffd27a;outline-offset:4px}
@media (prefers-reduced-motion:reduce){#boom span{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="mute" aria-label="Bật hoặc tắt nhạc">🔊</button>
<div class="top"><h1 id="ti"></h1><p id="su"></p></div>
<button id="boom" hidden><span>❤️</span><small>Chạm vào trái tim</small></button>
<div id="hint">Kéo để xoay vũ trụ · chạm để thả thêm tim</div>
<div id="intro">
  <h1 id="it"></h1>
  <p style="margin:0;color:var(--lilac)">Có một chuyến hàng đặc biệt đang chờ em nhận</p>
  <button id="go">Nhận hàng 📦</button>
</div>

    g.save();g.beginPath();g.rect(24,18,272,200);g.clip();g.drawImage(im,24+(272-w)/2,18-(h-200)*.3,w,h);g.restore()};im.src=PHOTOS[i]}
  return c}

/* thế giới */
var objs=[],i;
var NF=PHOTOS.length;for(i=0;i<NF;i++)objs.push({s:pol(i),w:230,r:520+(i%3)*95,a:i/NF*6.283,sp:.0005,y:(i%3-1)*135+(i*23%40-20)});
var EM=["📦","🚚","✈️","🚢","🚀","🌍","🛰️","🚛","⚓","🏗️","📦","✈️","🚢","🚚"];
EM.forEach(function(e){objs.push({s:emo(e),w:80+R()*40,r:900+R()*500,a:R()*6.283,sp:(R()<.5?-1:1)*(.0002+R()*.0004),y:R()*500-250})});
[["#ffb3d1","#7a1f5c"],["#b6a4ff","#2a1a7a"],["#8ff0e0","#0f4a5a"],["#ffd27a","#8a3a1a"],["#ff9ec0","#4a1a7a"]].forEach(function(p,k){
  var a=k*1.3+.4,e=(R()-.5)*1.2,d=1900+R()*500;objs.push({s:planet(p[0],p[1]),w:500+R()*400,fx:Math.cos(a)*Math.cos(e)*d,fy:Math.sin(e)*d,fz:Math.sin(a)*Math.cos(e)*d})});
var stars=[];for(i=0;i<(reduce?800:2400);i++){var u=R()*6.283,v=R()*2-1,q=Math.sqrt(1-v*v),d=1500+R()*3500;stars.push([Math.cos(u)*q*d,v*d,Math.sin(u)*q*d,R()*6.283,i%4,R()<.12?6+R()*12:0,.002+R()*.006])}
var hearts=[],wishes=[],wsp=null;

/* camera */
var yaw=0,pitch=.06,F=300,zoom=0,PX,PY,PK,PZ,cy,sy,cp,sp2;
function proj(x,y,z){var x1=x*cy-z*sy,z1=x*sy+z*cy,y2=y*cp-z1*sp2,z2=y*sp2+z1*cp;if(z2<8)return 0;PK=F/z2;PX=W/2+x1*PK;PY=H/2+y2*PK;PZ=z2;return 1}

function burst(n){
  if(!wsp)wsp=WISHES.map(function(t){var g0=mk(1,1).getContext("2d");g0.font="600 30px Be Vietnam Pro,sans-serif";var w=Math.ceil(g0.measureText(t).width)+50,c=mk(w,60),g=c.getContext("2d");
    g.font="600 30px Be Vietnam Pro,sans-serif";g.textAlign="center";g.textBaseline="middle";g.shadowColor="#ff4f8b";g.shadowBlur=14;g.fillStyle="#fff";g.fillText(t,w/2,32);return c});
  n=Math.min(n,5200-hearts.length);if(reduce)n=Math.floor(n/3);
  for(var k=0;k<n;k++){var u=R()*6.283,v=R()*2-1,q=Math.sqrt(1-v*v),dx=Math.cos(u)*q,dy=v,dz=Math.sin(u)*q,r0=40+R()*60,sp=6+R()*20;
    hearts.push({x:dx*r0,y:dy*r0,z:dz*r0,vx:dx*sp,vy:dy*sp,vz:dz*sp,s:HS[k%5],sz:12+R()*34,age:0,life:700+R()*400})}
}
function spawnWishes(){wsp.forEach(function(s,k){[0,1].forEach(function(rep){var a=R()*6.283;wishes.push({x:Math.cos(a)*(330+R()*180),y:R()*420-210,z:Math.sin(a)*(330+R()*180),s:s,age:-(k*14+rep*220),life:1500,dr:(R()-.5)*.0006})})})}

function starBurst(n){n=Math.min(n,5200-hearts.length);if(reduce)n=Math.floor(n/3);
  for(var k=0;k<n;k++){var u=R()*6.283,v=R()*2-1,q=Math.sqrt(1-v*v),dx=Math.cos(u)*q,dy=v,dz=Math.sin(u)*q,r0=30+R()*60,sp=8+R()*26;
    hearts.push({x:dx*r0,y:dy*r0,z:dz*r0,vx:dx*sp,vy:dy*sp,vz:dz*sp,s:SP[k%4],sz:8+R()*26,age:0,life:500+R()*500})}}
/* nhạc */
var ac,gn,muted=false,tm,N={C:261.63,D:293.66,E:329.63,F:349.23,G:392,A:440,B:466.16,H:523.25};
var SG=[["C",.75],["C",.25],["D",1],["C",1],["F",1],["E",2],["C",.75],["C",.25],["D",1],["C",1],["G",1],["F",2],["C",.75],["C",.25],["H",1],["A",1],["F",1],["E",1],["D",1],["B",.75],["B",.25],["A",1],["F",1],["G",1],["F",2]];
function play(){if(!ac||muted)return;var t=ac.currentTime+.05;SG.forEach(function(n){var o=ac.createOscillator(),g=ac.createGain(),d=n[1]*.5;o.type="triangle";o.frequency.value=N[n[0]];
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.26,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(gn);o.start(t);o.stop(t+d);t+=d});
  tm=setTimeout(play,(t-ac.currentTime+2.5)*1000)}
function music(){try{var A=window.AudioContext||window.webkitAudioContext;if(!A)return;ac=new A();gn=ac.createGain();gn.gain.value=.5;gn.connect(ac.destination);play()}catch(e){}}
$("mute").onclick=function(){muted=!muted;this.textContent=muted?"🔇":"🔊";clearTimeout(tm);if(!muted){if(ac){ac.resume();play()}else music()}};

/* luồng */
var live=false,boomed=false;
$("go").onclick=function(){$("intro").classList.add("gone");music();live=true;$("boom").hidden=false;burst(900);starBurst(1100)};
$("boom").onclick=function(e){e.stopPropagation();if(boomed)return;boomed=true;this.hidden=true;burst(1800);starBurst(900);spawnWishes();
  $("ti").textContent="Chúc mừng sinh nhật tuổi 19, "+NAME+"!";$("su").textContent="26/11, chúc cô gái logistics của anh mọi chuyến đi đều tới đích 💖";$("hint").style.opacity=1};
var dn=null,mv=0;
cv.addEventListener("pointerdown",function(e){dn={x:e.clientX,y:e.clientY,t:Date.now()};mv=0;cv.setPointerCapture(e.pointerId)});
cv.addEventListener("pointermove",function(e){if(!dn)return;var dx=e.clientX-dn.x,dy=e.clientY-dn.y;mv+=Math.abs(dx)+Math.abs(dy);yaw-=dx*.004;pitch=Math.max(-1.1,Math.min(1.1,pitch+dy*.003));dn.x=e.clientX;dn.y=e.clientY});
cv.addEventListener("pointerup",function(){if(dn&&mv<8&&boomed)burst(700);starBurst(300);dn=null});

/* vòng lặp */
var last=0;
function frame(t){
  var dt=Math.min(3,(t-last)/16.7||1);last=t;
  if(live)zoom=Math.min(1,zoom+.005*dt);var ez=zoom*(2-zoom);F=Math.min(W,H*1.1)*(.35+.65*ez)*1.15;
  if(!dn&&!reduce)yaw+=.0016*dt;
  cy=Math.cos(yaw);sy=Math.sin(yaw);cp=Math.cos(pitch);sp2=Math.sin(pitch);
  cx.clearRect(0,0,W,H);cx.globalCompositeOperation="source-over";
  stars.forEach(function(s){if(proj(s[0],s[1],s[2])){var a=.35+.65*Math.abs(Math.sin(t*s[6]+s[3]));cx.globalAlpha=a;if(s[5]){var z=s[5]*(.7+.5*a);cx.drawImage(SP[s[4]],PX-z/2,PY-z/2,z,z)}else{cx.fillStyle=TN[s[4]];cx.fillRect(PX,PY,1.7,1.7)}}});
  var vis=[];
  objs.forEach(function(o){if(o.fx===undefined){o.a+=o.sp*dt;if(proj(Math.cos(o.a)*o.r,o.y,Math.sin(o.a)*o.r)){o.z=PZ;o.px=PX;o.py=PY;o.pk=PK;vis.push(o)}}
    else if(proj(o.fx,o.fy,o.fz)){o.z=PZ;o.px=PX;o.py=PY;o.pk=PK;vis.push(o)}});
  vis.sort(function(a,b){return b.z-a.z});
  vis.forEach(function(o){var w=o.w*o.pk,h=w*o.s.height/o.s.width;if(w<2||w>2400)return;cx.globalAlpha=Math.min(1,(o.z-60)/220);cx.drawImage(o.s,o.px-w/2,o.py-h/2,w,h)});
  cx.globalAlpha=1;
  wishes.forEach(function(p){p.age+=dt;if(p.age<0||p.age>p.life)return;var a=Math.atan2(p.z,p.x)+p.dr*dt,r=Math.hypot(p.x,p.z);p.x=Math.cos(a)*r;p.z=Math.sin(a)*r;
    if(proj(p.x,p.y,p.z)){var w=p.s.width*.62*PK,h=p.s.height*.62*PK;if(w<10||w>1400)return;cx.globalAlpha=Math.min(1,p.age/60,(p.life-p.age)/150)*Math.min(1,(PZ-40)/160);cx.drawImage(p.s,PX-w/2,PY-h/2,w,h)}});
  cx.globalCompositeOperation="lighter";
  var dr=Math.pow(.975,dt),n=0;
  for(var k=0;k<hearts.length;k++){var p=hearts[k];p.age+=dt;if(p.age>p.life)continue;hearts[n++]=p;
    p.vx*=dr;p.vy*=dr;p.vz*=dr;p.x+=p.vx*dt;p.y+=p.vy*dt+Math.sin(t*.002+k)*.04;p.z+=p.vz*dt;
    if(proj(p.x,p.y,p.z)){var s=Math.min(p.sz*PK,200);if(s<2)continue;cx.globalAlpha=Math.min(1,(p.life-p.age)/180)*Math.min(1,(PZ-10)/80)*(.75+.25*Math.sin(t*.006+k));cx.drawImage(p.s,PX-s/2,PY-s/2,s,s)}}
  hearts.length=n;cx.globalAlpha=1;cx.globalCompositeOperation="source-over";
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame);
</script>
